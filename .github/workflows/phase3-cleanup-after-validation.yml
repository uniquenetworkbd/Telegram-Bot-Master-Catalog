name: Phase 3 runtime cleanup follow-up

on:
  workflow_run:
    workflows:
      - Catalog validation
    types:
      - completed

permissions:
  contents: write

jobs:
  cleanup:
    if: (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') && github.event.workflow_run.head_branch == 'phase-3-runtime-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Apply cleanup
        run: python3 scripts/phase3_runtime_cleanup.py
      - name: Validate duplicate IDs and JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          source=Path('index.html').read_text(encoding='utf-8')
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=set()
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d:
                      assert d['id'] not in self.ids, f'Duplicate id: {d["id"]}'
                      self.ids.add(d['id'])
          p=P(); p.feed(source); p.close()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',source,re.I)
          assert len(scripts)==1
          Path('/tmp/catalog.js').write_text(scripts[0],encoding='utf-8')
          assert source.count('id="exportBtn"')==1
          assert source.count('id="runtimeOverall"')==1
          PY
          node --check /tmp/catalog.js
      - name: Commit cleanup
        run: |
          if git diff --quiet -- index.html; then
            echo 'No cleanup changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm scripts/phase3_runtime_cleanup.py || true
          git commit -m 'fix: clean up Phase 3 runtime controls'
          git push origin HEAD:phase-3-runtime-cleanup
