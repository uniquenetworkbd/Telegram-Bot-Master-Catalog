name: Catalog validation

on:
  push:
    branches: [main, phase-1-mobile-app-foundation, phase-1-mobile-app-foundation-v2, phase-4c-4d-live-audit, phase-5-implementation-v1, feat/main-engine-runtime-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-data-audit:
    name: Source, data integrity and static security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Independent catalog integrity audit
        run: python3 scripts/validate_catalog.py
      - name: JavaScript syntax checks
        run: |
          node --check assets/js/catalog-repository.js
          node --check assets/js/app-shell.js
          node --check assets/js/engine-core.js
          node --check assets/js/history-engine.js
          node --check assets/js/module-manager.js
          node --check assets/js/search-engine.js
          node --check assets/js/analytics-engine.js
          node --check assets/js/logging-engine.js
          node --check assets/js/security-engine.js
          node --check assets/js/admin-engine.js
          node --check assets/js/system-engine.js
          node --check assets/js/bot-engine.js
          node --check assets/js/bot-modules/catalog-query.js
          node --check scripts/telegram/send-smoke-message.mjs
          node --check assets/js/main-engine.js
          node --check assets/js/catalog-feature.js
          node --check assets/js/global-bottom-nav.js

  browser-regression:
    name: Real-data browser regression, security and responsive tests
    needs: source-and-data-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/tbmc-browser playwright
          /tmp/tbmc-browser/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Run mobile and desktop browser smoke tests
        env:
          NODE_PATH: /tmp/tbmc-browser/node_modules
        run: node tests/browser-smoke.cjs

