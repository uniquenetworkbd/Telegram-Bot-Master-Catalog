name: Catalog validation

on:
  push:
    branches:
      - main
      - phase-1-mobile-app-foundation
      - phase-1-mobile-app-foundation-v2
      - phase-4c-4d-live-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HTML structure and required mobile controls
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          source = Path("index.html").read_text(encoding="utf-8")

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.html_open = 0
                  self.html_close = 0
                  self.script_open = 0
                  self.script_close = 0
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      if attrs["id"] in self.ids:
                          raise AssertionError(f"Duplicate HTML id: {attrs['id']}")
                      self.ids.add(attrs["id"])
                  if tag == "html": self.html_open += 1
                  if tag == "script": self.script_open += 1
              def handle_endtag(self, tag):
                  if tag == "html": self.html_close += 1
                  if tag == "script": self.script_close += 1

          parser = Parser()
          parser.feed(source)
          parser.close()
          assert parser.html_open == 1 and parser.html_close == 1, "HTML root tags are missing or duplicated"
          assert parser.script_open == parser.script_close, "Unbalanced script tags"
          assert parser.script_open == 1, "Expected one inline application script"
          required = [
              "moreNavBtn", "moreMenu", "themeSelect",
              "page-home", "page-dashboard", "page-catalog", "page-bot",
              "page-profile", "page-system", "rows", "search", "category",
              "api", "automation", "pageSize", "prev", "next"
          ]
          missing = sorted(set(required) - parser.ids)
          assert not missing, f"Missing required element IDs: {missing}"
          assert 'class="bottom-nav"' in source, "Mobile bottom navigation is missing"
          assert 'function restoreCatalogState()' in source, "Catalog state restore is missing"
          assert "addEventListener('popstate'" in source, "Browser Back handling is missing"
          assert "data-mobile-route" in source, "Mobile navigation controls are missing"
          assert "id=\"themeSelect\"" in source, "Theme control is missing"
          print(f"HTML checks passed: {len(parser.ids)} unique IDs; all six pages and mobile controls found.")
          PY

      - name: Validate catalog CSV structure and integrity
        run: |
          python3 - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          path = Path("data/Telegram_Bot_Master_Catalog_1000.csv")
          assert path.exists(), f"Missing catalog dataset: {path}"

          with path.open("r", encoding="utf-8-sig", newline="") as fh:
              reader = csv.DictReader(fh)
              fieldnames = reader.fieldnames or []
              rows = list(reader)

          expected = {
              "index", "Bot ID", "Category No", "Category", "English Category",
              "Bot Name", "What it does", "Free/Low-cost Technology", "API Required?",
              "Automation Potential", "Monetization Potential", "Suggested MVP", "Notes"
          }
          assert rows, "Catalog CSV contains no data records"
          assert set(fieldnames) == expected, f"Catalog CSV schema changed unexpectedly: {fieldnames!r}"

          ids = []
          category_numbers = []
          for row in rows:
              bot_id = (row.get("Bot ID") or "").strip()
              category = (row.get("Category") or "").strip()
              bot_name = (row.get("Bot Name") or "").strip()
              value = (row.get("Category No") or "").strip()
              assert bot_id, "Every catalog record must have a Bot ID"
              assert category, f"Missing Category for {bot_id}"
              assert bot_name, f"Missing Bot Name for {bot_id}"
              assert value.isdigit(), f"Invalid Category No for {bot_id}: {value!r}"
              ids.append(bot_id)
              category_numbers.append(int(value))

          assert len(ids) == len(set(ids)), "Duplicate Bot ID detected"
          counts = Counter(category_numbers)
          assert min(counts) == 1, "Category numbering must start at 1"
          print(f"Catalog integrity passed: {len(rows)} records, {len(counts)} categories, {len(set(ids))} unique Bot IDs.")
          print("Note: CI validates structural integrity only; it does not require the planned 1,000-record target.")
          print("Category distribution:", dict(sorted(counts.items())))
          PY

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", source, re.IGNORECASE)
          assert len(scripts) == 1, f"Expected one inline script, found {len(scripts)}"
          Path("/tmp/catalog-app.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/catalog-app.js

      - name: Browser smoke tests (mobile navigation, search state and theme)
        run: |
          mkdir -p /tmp/tbmc-browser
          npm install --prefix /tmp/tbmc-browser playwright
          /tmp/tbmc-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/tbmc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          cat > /tmp/tbmc-browser/smoke.cjs <<'JS'
          const { chromium } = require('/tmp/tbmc-browser/node_modules/playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));

            const headers = ['index','Bot ID','Category No','Category','English Category','Bot Name','What it does','Free/Low-cost Technology','API Required?','Automation Potential','Monetization Potential','Suggested MVP','Notes'];
            const sample = [
              headers.join(','),
              '1,BOT-001,1,Utilities,Utilities,Alpha Bot,Alpha description,Free,No,High,Medium,Alpha MVP,',
              '2,BOT-002,1,Utilities,Utilities,Beta Bot,Beta description,Free,No,Medium,Low,Beta MVP,'
            ].join('\n');

            await page.route('**/data/Telegram_Bot_Master_Catalog_1000.csv', route =>
              route.fulfill({ status: 200, contentType: 'text/csv; charset=utf-8', body: sample })
            );

            await page.goto('http://127.0.0.1:4173/index.html');
            await page.waitForFunction(() => document.querySelector('#csvBadge')?.textContent === 'Loaded', null, { timeout: 10000 });
            assert.equal(await page.locator('.bottom-nav').isVisible(), true, 'mobile bottom navigation should be visible');

            await page.locator('[data-mobile-route="catalog"]').click();
            await page.locator('#search').fill('Alpha');
            await page.locator('#rows [data-bot="BOT-001"]').first().waitFor();
            assert.equal(await page.locator('#matchStat').textContent(), '1', 'search should return one matching record');

            await page.locator('#rows [data-bot="BOT-001"]').first().click();
            await page.locator('#page-bot').waitFor({ state: 'visible' });
            await page.evaluate(() => history.back());
            await page.waitForFunction(() => location.hash === '#catalog' && document.querySelector('#page-catalog')?.classList.contains('active'));
            assert.equal(await page.locator('#search').inputValue(), 'Alpha', 'search query should be restored after Back');
            await page.locator('#rows [data-bot="BOT-001"]').first().waitFor();

            await page.locator('#moreNavBtn').click();
            await page.locator('#moreMenu a[data-route="system"]').click();
            await page.locator('#page-system').waitFor({ state: 'visible' });
            await page.locator('#themeSelect').selectOption('light');
            assert.equal(await page.locator('html').getAttribute('data-theme'), 'light', 'Light theme should apply');
            await page.evaluate(() => history.back());
            await page.waitForFunction(() => location.hash === '#catalog' && document.querySelector('#page-catalog')?.classList.contains('active'));
            assert.equal(await page.locator('#moreMenu').evaluate(el => el.classList.contains('open')), true, 'Back from System should restore the More menu');

            assert.deepEqual(errors, [], 'browser console should not report uncaught page errors');
            await browser.close();
            console.log('Browser smoke tests passed: mobile nav, CSV-backed search, details/back state, More menu restoration and theme selection.');
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          node /tmp/tbmc-browser/smoke.cjs
