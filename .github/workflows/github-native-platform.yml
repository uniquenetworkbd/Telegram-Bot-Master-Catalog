name: GitHub-native platform maintenance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'assets/js/logs-audit.js'
      - 'assets/js/system-configuration.js'
      - 'assets/js/version-logs.js'
      - 'assets/js/live-information.js'
      - 'assets/js/global-bottom-nav.js'
      - 'index.html'
      - 'assets/css/app.css'
      - 'docs/architecture/GITHUB-NATIVE-SERVER-SIDE-ARCHITECTURE-v1.0.md'
      - 'scripts/**'
      - '.github/workflows/github-native-platform.yml'

permissions:
  contents: read

jobs:
  platform-audit:
    name: GitHub-native platform audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate current platform pages and GitHub-native boundary
        run: |
          test -f pages/logs-audit.html
          test -f pages/system-configuration.html
          test -f pages/version-logs.html
          test -f pages/live-information.html
          grep -qi "GitHub-native" README.md
          grep -q "LIVE GITHUB DATA" pages/logs-audit.html
          grep -q "assets/js/logs-audit.js" pages/logs-audit.html
          grep -qi "System configuration" assets/js/global-bottom-nav.js
          grep -qi "Version Logs" assets/js/global-bottom-nav.js
          grep -qi "Live information" assets/js/global-bottom-nav.js
          grep -q "tbmc-bottom-navigation" assets/js/global-bottom-nav.js
          grep -q "themeSelect" pages/system-configuration.html
          grep -q "Documented versions" pages/version-logs.html
          grep -q "live-information.js" pages/live-information.html
      - name: Validate runtime scripts
        run: |
          node --check assets/js/engine-core.js
          node --check assets/js/logs-audit.js
          node --check assets/js/system-configuration.js
          node --check assets/js/version-logs.js
          node --check assets/js/live-information.js
          node --check assets/js/global-bottom-nav.js
      - name: Report platform boundary
        run: |
          echo "GitHub-native platform audit passed."
          echo "External backend providers: none"
          echo "Visitor analytics ingestion: not implemented or claimed"
          echo "Live Logs & Audit data: public GitHub REST API"
          echo "Version Logs: human-readable release notes only; commit history remains in Logs & Audit"
          echo "Live information: local browser runtime plus public repository signals"
          echo "Global real-time visitor counts: not available from static GitHub Pages"
          echo "Server-side automation: GitHub Actions"
