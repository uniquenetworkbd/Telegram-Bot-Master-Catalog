name: Phase 3 validation follow-up patcher

on:
  workflow_run:
    workflows:
      - Catalog validation
    types:
      - completed

permissions:
  contents: write

jobs:
  patch:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'phase-3-screen-design-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Apply Phase 3 implementation once
        run: |
          if grep -q 'id="runtimeOverall"' index.html; then
            echo 'Phase 3 runtime implementation is already present; nothing to patch.'
            exit 0
          fi
          python3 scripts/phase3_system_patch.py

      - name: Validate patched JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('index.html').read_text(encoding='utf-8')
          required = ['runtimeChecks','runtimeOverall','csvCheck','integrityCheck','filterCheck','responsiveCheck','exportCheck','themeCheck','navCheck','exportBtn']
          missing = [x for x in required if f'id="{x}"' not in source]
          assert not missing, f'Missing Phase 3 IDs: {missing}'
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', source, re.I)
          assert len(scripts) == 1
          Path('/tmp/catalog.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/catalog.js

      - name: Commit implementation to PR branch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm scripts/phase3_system_patch.py .github/workflows/phase3-pr-patch.yml .github/workflows/phase3-system-runtime-patch.yml || true
          git commit -m 'feat: refine Phase 3 System runtime checks'
          git push origin HEAD:phase-3-screen-design-v1
