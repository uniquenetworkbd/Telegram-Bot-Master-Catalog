name: Phase 3 PR patch

on:
  pull_request:
    types: [opened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply Phase 3 System patch
        run: python3 scripts/phase3_system_patch.py

      - name: Validate HTML and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('index.html').read_text(encoding='utf-8')
          required = ['runtimeChecks','runtimeOverall','csvCheck','integrityCheck','filterCheck','responsiveCheck','exportCheck','themeCheck','navCheck','exportBtn']
          missing = [x for x in required if f'id="{x}"' not in source]
          assert not missing, f'Missing Phase 3 IDs: {missing}'
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', source, re.I)
          assert len(scripts) == 1
          Path('/tmp/catalog.js').write_text(scripts[0], encoding='utf-8')
          print('Phase 3 static checks passed')
          PY
          node --check /tmp/catalog.js

      - name: Commit Phase 3 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm scripts/phase3_system_patch.py .github/workflows/phase3-pr-patch.yml .github/workflows/phase3-system-runtime-patch.yml || true
          git commit -m 'feat: refine Phase 3 System runtime checks'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
